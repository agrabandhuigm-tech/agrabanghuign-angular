<mat-card class="p-4 shadow-md rounded-xl max-w-lg mx-auto">
  <mat-card-title>
    {{ editId ? 'Update Gallery' : 'Add New Gallery' }}
  </mat-card-title>

  <mat-card-content>
    <form [formGroup]="galleryForm" (ngSubmit)="onSubmit()">
      
      <mat-form-field appearance="outline" class="w-100 mb-3">
        <mat-label>Gallery Name</mat-label>
        <input matInput formControlName="name" placeholder="Enter gallery name">
        <mat-error *ngIf="galleryForm.get('name')?.hasError('required')">
          Gallery name is required
        </mat-error>
      </mat-form-field>

      <div class="mb-3">
        <button mat-stroked-button color="primary" component="label">
          <mat-icon>upload</mat-icon>
          Upload Images
          <input type="file" (change)="onImagesSelected($event)" multiple hidden>
        </button>
      </div>

      <div class="flex flex-wrap gap-3 mb-3" *ngIf="previewUrls.length > 0">
        <mat-card *ngFor="let url of previewUrls" class="preview-card">
          <img [src]="url" alt="preview">
        </mat-card>
      </div>

      <button mat-raised-button color="primary" type="submit">
        {{ editId ? 'Update' : 'Save' }}
      </button>
    </form>
  </mat-card-content>
</mat-card>
