<div class="viewer-container">
  <button mat-icon-button class="close-btn" (click)="close()">
    <mat-icon>close</mat-icon>
  </button>

  <button mat-icon-button class="nav-btn left" (click)="prev()">
    <mat-icon>chevron_left</mat-icon>
  </button>

  <img [src]="data.images[currentIndex]?.filedata" class="viewer-image" alt="Image Viewer">

  <button mat-icon-button class="nav-btn right" (click)="next()">
    <mat-icon>chevron_right</mat-icon>
  </button>
</div>
