<mat-card class="biodata-card">
  <mat-card-title>
    <mat-card class="event-heading">
      <div class="row event-text">
        <div class="col-8"> <span class="">Marriage Biodata List</span></div>
        <div class="col-2 text-end" (click)="routeToUpload()"> <span class="text-end">Upload New Biodata<mat-icon>
              cloud_upload
            </mat-icon></span></div>
      </div>
    </mat-card>
  </mat-card-title>
  <mat-divider></mat-divider>


  <table mat-table [dataSource]="dataSource" style="width:100%">

    <ng-container matColumnDef="image">
      <th mat-header-cell *matHeaderCellDef> # </th>
      <td mat-cell *matCellDef="let element;let i=index">
        <img [src]="jsonData[i]?.imageBase64" alt="Image" width="80" *ngIf="jsonData[i]?.imageBase64" />
      </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>


    <ng-container matColumnDef="fatherName">
      <th mat-header-cell *matHeaderCellDef> Father Name </th>
      <td mat-cell *matCellDef="let element"> {{element.fatherName}} </td>
    </ng-container>


    <ng-container matColumnDef="age">
      <th mat-header-cell *matHeaderCellDef> Age </th>
      <td mat-cell *matCellDef="let element"> {{element.age}} </td>
    </ng-container>

    <ng-container matColumnDef="occupation">
      <th mat-header-cell *matHeaderCellDef> Occupation </th>
      <td mat-cell *matCellDef="let element"> {{element.occupation}} </td>
    </ng-container>


    <ng-container matColumnDef="contact">
      <th mat-header-cell *matHeaderCellDef> Contact </th>
      <td mat-cell *matCellDef="let element"> {{element.contact}} </td>
    </ng-container>




    <ng-container matColumnDef="resume">
      <th mat-header-cell *matHeaderCellDef> Resume </th>
      <td mat-cell *matCellDef="let element;let i=index">
        <!-- <button mat-button >Download PDF</button> -->
        <mat-icon (click)="downloadResume(jsonData[i]?.pdfBase64, element.name + '_resume.pdf')" class="download-icon">
          picture_as_pdf</mat-icon>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>
</mat-card>
