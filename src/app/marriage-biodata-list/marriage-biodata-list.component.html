<div class="page-container">
  <div class="page-header">
    <div class="header-content">
      <h1 class="page-title">Marriage Biodata List</h1>
      <button mat-raised-button class="upload-btn" (click)="routeToUpload()">
        <mat-icon>cloud_upload</mat-icon> Upload New Biodata
      </button>
    </div>
  </div>

  <div class="gallery-grid">
    <div class="biodata-card" *ngFor="let element of jsonData; let i = index">
      <div class="card-image-container">
        <img [src]="jsonData[i]?.imageBase64 ? jsonData[i]?.imageBase64 : 'assets/images/user.png'"
          (error)="jsonData[i].imageBase64 = 'assets/images/user.png'" alt="{{ element.name }}" class="profile-image" />
        <div class="card-overlay">
          <button mat-fab color="accent" class="download-fab"
            (click)="downloadResume(jsonData[i]?.pdfBase64, element.name + '_resume.pdf')" matTooltip="Download Resume">
            <mat-icon>file_download</mat-icon>
          </button>
        </div>
      </div>

      <div class="card-content">
        <h2 class="candidate-name">{{ element.name }}</h2>
        <div class="candidate-details">
          <div class="detail-row">
            <mat-icon class="detail-icon">person</mat-icon>
            <span class="detail-label">Father:</span>
            <span class="detail-value">{{ element.fatherName }}</span>
          </div>
          <div class="detail-row">
            <mat-icon class="detail-icon">cake</mat-icon>
            <span class="detail-label">Age:</span>
            <span class="detail-value">{{ element.age }} Years</span>
          </div>
          <div class="detail-row">
            <mat-icon class="detail-icon">work</mat-icon>
            <span class="detail-label">Job:</span>
            <span class="detail-value">{{ element.occupation }}</span>
          </div>
          <div class="detail-row">
            <mat-icon class="detail-icon">phone</mat-icon>
            <span class="detail-label">Contact:</span>
            <span class="detail-value">{{ element.contact }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
